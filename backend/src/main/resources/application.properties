spring.application.name=leadScrapper


# Disable JPA/DataSource auto-config since we're not using a database yet
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

server.port=8080

# Google Search Scraper settings
# Max number of result URLs to process per search
google.search.max.results=20
# Timeout in seconds for visiting each result website
google.search.page.timeout=10
# Shared concurrent HTTP website checks (1-32)
google.search.concurrency=8

# Heimdall session authentication (set cookie.secure=true behind production HTTPS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=always
